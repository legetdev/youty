[project]
name = "youty-mcp"
version = "2.0.0"
description = "Youty MCP server — lets AI assistants search, read, watch, and save videos in your local Youty vault."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Bent Eisheuer", email = "legetdev@gmail.com" }
]
keywords = ["mcp", "youty", "vault", "sqlite-vec", "search", "rag", "youtube"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Text Processing :: Indexing",
]
# Phase Q.5: upper bounds on every dependency so a future major release
# can't silently break the MCP server. Lower bounds match what the code
# actually uses; upper bounds capped one major above current (or at the
# next 0.x for pre-1.0 packages).
dependencies = [
    # MCP Python SDK 2.x: the 2026-07-28 protocol (server/discover, sessionless)
    # with the legacy initialize handshake kept for older clients.
    "mcp>=2.3.0,<3",
    "sqlite-vec>=0.1.9,<0.2.0",     # pre-1.0; breaking changes likely in 0.2
    "numpy>=1.26.0,<3.0.0",
    # Queries are embedded on-device with the same EmbeddingGemma 2 Core ML model
    # the Youty app indexed with (CPU, so it loads instantly in every AI session).
    # Core ML exists only on macOS; Linux installs (CI, sdist) stay lean and run
    # the fixture test suite.
    "coremltools>=9.0,<10 ; sys_platform == 'darwin'",
    # Google's tokenizer.json, run by the existing Rust tokenizer engine.
    "tokenizers>=0.23,<2",
]

[project.urls]
Homepage = "https://github.com/legetdev/youty"
Repository = "https://github.com/legetdev/youty"
Issues = "https://github.com/legetdev/youty/issues"
Documentation = "https://github.com/legetdev/youty/blob/main/youty-mcp/README.md"

[project.scripts]
youty-mcp = "youty_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
