# The required check. It runs this repository's own CI (build, app and CLI tests,
# MCP tests, release checks) and reports the `checks` job once all of it passed.
# The shared agent-config pipeline can't be used here: GitHub doesn't let a
# public repository call a workflow from a private one.
name: checks
on: pull_request
permissions:
  contents: read
concurrency:  # a new push cancels the run for the commit it replaces
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  checks:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build, tests and release checks passed."
