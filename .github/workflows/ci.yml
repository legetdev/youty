name: CI

# Build + test gate. Runs on every push to main, on PRs, and on demand.
# - macOS job: regenerates the Xcode project from project.yml, fetches the
#   on-device models, and builds both the app and the CLI on a clean macOS 26
#   runner (Debug, unsigned) so build breakage is caught before release, then
#   runs the offline smoke probes (the network canary runs on the owner's Mac).
# - Linux job: runs the youty-mcp test suite.
# No secrets required.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: Build app + CLI (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Fetch on-device models
        run: ./Scripts/fetch-models.sh

      - name: Generate Xcode project
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: Verify regenerated updater sandbox settings
        run: python3 Scripts/verify-updater.py

      - name: Verify the bundled Claude Desktop extension is current
        run: ./Scripts/build-mcpb.sh --check

      # A repo-local package checkout avoids stale paths in the runner's shared
      # SwiftPM cache, which once failed package resolution outright.
      - name: Build app + run unit tests (Debug, unsigned)
        run: |
          xcodebuild test -project youty.xcodeproj -scheme youty \
            -configuration Debug -derivedDataPath build/ci \
            -clonedSourcePackagesDirPath build/spm \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify frame range failure handling
        run: |
          xcrun swiftc Sources/FFmpegURLSessionIO.swift Sources/DebugLog.swift \
            Scripts/test-frame-ranges.swift -o /tmp/youty-frame-range-tests
          /tmp/youty-frame-range-tests

      - name: Verify CLI and malformed media boundaries
        run: |
          xcrun swiftc Sources/SidxParser.swift Sources/MP4MoofParser.swift \
            Sources/PlatformRouter.swift CLI/ArgsParser.swift \
            Scripts/test-swift-boundaries.swift -o /tmp/youty-boundary-tests
          /tmp/youty-boundary-tests

      - name: Build CLI (Debug, unsigned)
        run: |
          xcodebuild -project youty.xcodeproj -scheme youty-cli \
            -configuration Debug -derivedDataPath build/ci \
            -clonedSourcePackagesDirPath build/spm \
            CODE_SIGNING_ALLOWED=NO build

      # Offline probes only: GitHub runners are blocked by YouTube, so the
      # network canary runs weekly on the owner's Mac (Scripts/canary-local.sh).
      - name: Offline smoke probes (models, vault hardness, CLI)
        run: YOUTY_BUILD_DIR=build/ci ./Scripts/smoke-test-extractors.sh --offline

      - name: Build the standalone Homebrew CLI project
        run: |
          xcodegen generate --spec project-cli.yml
          xcodebuild -project youty-cli.xcodeproj -scheme youty-cli \
            -configuration Debug -derivedDataPath build/cli-ci \
            CODE_SIGNING_ALLOWED=NO build

  mcp-tests:
    name: youty-mcp tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test coordinated release checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Scripts -p 'test_release*.py' -v

      - name: Verify CLI installation failure preserves working resources
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s Scripts -p 'test_install_cli.py' -v

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Run tests
        working-directory: youty-mcp
        run: |
          uv sync --locked
          uv run --locked pytest -q
