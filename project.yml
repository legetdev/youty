name: youty
options:
  bundleIdPrefix: dev.leget
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      # Compacting (Phase Q.5): strip + dead-code + size opt + LTO for
      # Release builds only. Debug stays unaffected so iteration speed +
      # debuggability are preserved.
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_STYLE: all
      GCC_OPTIMIZATION_LEVEL: s         # size-optimized C/ObjC
      SWIFT_OPTIMIZATION_LEVEL: "-O"    # default Release optimization
      SWIFT_COMPILATION_MODE: wholemodule
      LLVM_LTO: YES                     # link-time optimization for both Swift + clang
      OTHER_LDFLAGS: "$(inherited) -dead_strip"

targets:
  youty:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "IndexSchema.sql"
          - "Youty.mcpb"
      - path: Sources/IndexSchema.sql
        buildPhase: resources
      # Claude Desktop extension opened by Onboarding's one-click button
      # (built by Scripts/build-mcpb.sh).
      - path: Sources/Youty.mcpb
        buildPhase: resources
      # Bundled license texts — surfaced by the in-app About panel and
      # required for LGPL §1 compliance (accompany the binary with the
      # license text of every LGPL-licensed component).
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
      - path: Vendor/ffmpeg/licenses
        buildPhase: resources
      # EmbeddingGemma 2 (Apache-2.0): one on-device space for transcript text,
      # on-screen text, and frames. Text + vision Core ML packages (compiled to
      # .mlmodelc at build time), the memory-mapped token and position tables,
      # the compact native tokenizer, the original tokenizer.json (so the MCP
      # server can reuse the installed app's models without a download), and
      # the license + NOTICE.
      - path: Vendor/embeddinggemma2/models/EmbeddingGemma2Text.mlpackage
        buildPhase: resources
      - path: Vendor/embeddinggemma2/models/EmbeddingGemma2Vision.mlpackage
        buildPhase: resources
      - path: Vendor/embeddinggemma2/resources/EmbeddingGemma2Tokens.bf16
        buildPhase: resources
      - path: Vendor/embeddinggemma2/resources/EmbeddingGemma2Positions.f16
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/vocab.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/merges.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/added_tokens.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/tokenizer.json
        buildPhase: resources
      - path: Vendor/embeddinggemma2/licenses
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leget.youty
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/youty.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FFmpegBridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/ffmpeg/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/ffmpeg/lib
        OTHER_LDFLAGS: "-lavcodec -lavformat -lavutil -lswscale -liconv -lbz2 -lz -lsqlite3 -framework Security -framework CoreFoundation -framework AudioToolbox -framework VideoToolbox"
    dependencies:
      - target: YoutyShareExtension
      - package: Sparkle
    entitlements:
      path: Sources/youty.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Literal names also survive release-app.sh's direct codesign step.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - dev.leget.youty-spks
          - dev.leget.youty-spki

  YoutyShareExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: ShareExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leget.youty.ShareExtension
        PRODUCT_NAME: "Save to Youty"
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../../../Frameworks"
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true

  youty-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "IndexSchema.sql"
          - "Info.plist"
          - "youty.entitlements"
          - "Assets.xcassets"
          - "AppIcon.icon"
          # GUI-only — the CLI has its own main + no SwiftUI surface
          - "youtyApp.swift"
          - "AppDelegate.swift"
          - "ContentView.swift"
          - "SettingsView.swift"
          - "AuthLoginView.swift"
          - "MenuBarController.swift"
          - "MainWindowKeeper.swift"
          - "IngestionFunnel.swift"
          - "YoutyAppIntents.swift"
          - "DebugRunner.swift"
          - "OnboardingView.swift"
          - "IndexBadgeView.swift"
          - "IndexStatusStore.swift"
          - "AppUpdater.swift"
          - "Youty.mcpb"
      - path: Sources/IndexSchema.sql
        buildPhase: resources
      # Same EmbeddingGemma 2 resources as the app, so CLI saves index text and
      # frames in the identical space. A standalone CLI resolves them from the
      # shared directory install-cli.sh / the Homebrew formula populate
      # (SharedResourceLocator).
      - path: Vendor/embeddinggemma2/models/EmbeddingGemma2Text.mlpackage
        buildPhase: resources
      - path: Vendor/embeddinggemma2/models/EmbeddingGemma2Vision.mlpackage
        buildPhase: resources
      - path: Vendor/embeddinggemma2/resources/EmbeddingGemma2Tokens.bf16
        buildPhase: resources
      - path: Vendor/embeddinggemma2/resources/EmbeddingGemma2Positions.f16
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/vocab.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/merges.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/added_tokens.bin
        buildPhase: resources
      - path: Vendor/embeddinggemma2/tokenizer/tokenizer.json
        buildPhase: resources
      - path: Vendor/embeddinggemma2/licenses
        buildPhase: resources
      - path: CLI
    settings:
      base:
        PRODUCT_NAME: youty
        PRODUCT_BUNDLE_IDENTIFIER: dev.leget.youty.cli
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FFmpegBridging.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/ffmpeg/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/ffmpeg/lib
        OTHER_LDFLAGS: "-lavcodec -lavformat -lavutil -lswscale -liconv -lbz2 -lz -lsqlite3 -framework Security -framework CoreFoundation -framework AudioToolbox -framework VideoToolbox -framework Foundation -framework AppKit -framework WebKit -framework Speech"
        SKIP_INSTALL: NO
        # Hardened runtime is required for Developer ID signing + notarization;
        # without it Gatekeeper blocks the brew-installed CLI on other machines.
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  # Unit tests for the pure logic (URL parsing, timestamp + markdown
  # formatting). App-hosted so tests use `@testable import youty`; no network,
  # no I/O. Run with `xcodebuild test -scheme youty`.
  youtyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.leget.youty.tests
        GENERATE_INFOPLIST_FILE: YES
        # `@testable import youty` pulls in the app module's FFmpeg bridging
        # header, so the test target needs the FFmpeg include path at compile
        # time. The actual symbols resolve from the host app at runtime.
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/ffmpeg/include
    dependencies:
      - target: youty

schemes:
  youty:
    build:
      targets:
        youty: all
        youtyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - youtyTests
